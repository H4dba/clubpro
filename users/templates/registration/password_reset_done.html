{% extends 'base.html' %}

{% block title %}Email enviado - AXM{% endblock %}

{% block content %}
<div class="auth-page fade-in-up">
    <div class="container"><div class="row justify-content-center min-vh-75 align-items-center"><div class="col-lg-5 col-md-7">
        <div class="auth-card text-center">
            <div class="auth-logo"><i class="fas fa-envelope-open-text"></i></div>
            <h2 class="auth-title">Confira seu email</h2>
            <p class="auth-subtitle">Se houver uma conta com esse email, enviaremos as instruções para redefinir sua senha.</p>
            <a href="{% url 'login' %}" class="btn btn-primary">Voltar para o login</a>
        </div>
    </div></div></div>
</div>
{% endblock %}
