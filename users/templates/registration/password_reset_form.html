{% extends 'base.html' %}

{% block title %}Redefinir senha - AXM{% endblock %}

{% block content %}
<div class="auth-page fade-in-up">
    <div class="container">
        <div class="row justify-content-center min-vh-75 align-items-center">
            <div class="col-lg-5 col-md-7">
                <div class="auth-card">
                    <div class="auth-header">
                        <div class="auth-logo"><i class="fas fa-key"></i></div>
                        <h2 class="auth-title">Esqueceu sua senha?</h2>
                        <p class="auth-subtitle">Informe seu email e enviaremos um link para criar uma nova senha.</p>
                    </div>
                    <form method="post" class="auth-form">
                        {% csrf_token %}
                        {{ form.email.errors }}
                        <div class="form-group">
                            <label for="id_email" class="form-label"><i class="fas fa-envelope me-2"></i>E-mail</label>
                            {{ form.email }}
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">
                            <i class="fas fa-paper-plane me-2"></i>Enviar link
                        </button>
                    </form>
                    <div class="auth-links mt-3 text-center">
                        <a href="{% url 'login' %}" class="auth-link-small">Voltar para o login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
